<!DOCTYPE html>

    <!-- Static meta tags. Language-dependent tags (title, description, canonical,
         hreflang, og:title/description/url/locale, twitter:title/description) are
         injected per route at build time via <Head> in LanguageProvider. -->
    <meta name="keywords" content="foiling, hydrofoil, sailing, sail racing, yacht racing, regatta, regate, vela, nautica, foiling monohull, canting foil, righting moment, naval architecture, progettazione navale, boat design, costruzione barche, America's Cup, Coppa America, Mini Transat, IMOCA, sailing innovation, foil arm" />
    <meta name="author" content="Francesco Belvisi" />

    <!-- Open Graph / Facebook / LinkedIn (static parts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CAFAR — Canting Foil Arm System" />
    <meta property="og:image" content="https://cafarfoilingsystem.com/og-image.jpg" />
    <meta property="og:image:alt" content="CAFAR Canting Foil Arm hydrofoil system on a racing sailing yacht" />

    <!-- Twitter / X (static parts) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://cafarfoilingsystem.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <!-- Google Analytics 4 with Consent Mode v2.
         Every consent type defaults to "denied" BEFORE gtag.js loads, so no
         analytics or advertising storage is written until the visitor accepts
         in the cookie banner. Until then GA only receives cookieless pings.
         Advertising consent is never granted: the site runs no ad tags. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });

      // Returning visitor who already accepted: restore the grant before the
      // first hit, so the page view is measured instead of only pinged.
      try {
        if (window.localStorage.getItem('cafar-cookie-consent') === 'accepted') {
          gtag('consent', 'update', { 'analytics_storage': 'granted' });
        }
      } catch (e) { /* storage blocked — stay denied */ }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VE82YRPQFP"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-VE82YRPQFP');
    </script>

    <!-- Structured data: Organization + Product (Invention) + WebSite -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

        {

          "@id": "https://cafarfoilingsystem.com/#organization",

          "url": "https://cafarfoilingsystem.com/",
          "logo": "https://cafarfoilingsystem.com/lovable-uploads/cafar-logo-white.png",
          "email": "contact@cafarfoilingsystem.com",
          "description": "Developers of CAFAR, a patented Canting Foil Arm System — foiling technology for sailing yachts, foiling monohulls and racing boats.",
          "founder": [
            { "@type": "Person", "name": "Francesco Belvisi" },
            { "@type": "Person", "name": "Marco Calatroni" }
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "contact@cafarfoilingsystem.com",
            "contactType": "sales"
          }
        },
        {
          "@type": "Product",
          "@id": "https://cafarfoilingsystem.com/#product",
          "name": "CAFAR — Canting Foil Arm System",
          "alternateName": "Canting Foil Arm",
          "category": "Hydrofoil sailing system",
          "url": "https://cafarfoilingsystem.com/",
          "image": "https://cafarfoilingsystem.com/og-image.jpg",
          "brand": { "@id": "https://cafarfoilingsystem.com/#organization" },
          "description": "CAFAR is a patented Canting Foil Arm System: foiling technology that lets a foiling monohull increase its foil lever arm through an articulated canting arm, raising the righting moment without widening the hull. Built for sail racing and sailing innovation.",
          "keywords": "canting foil, foil arm system, foiling technology, sailing innovation, righting moment, hydrofoil, sail racing"
        },
        {
          "@type": "WebSite",
          "@id": "https://cafarfoilingsystem.com/#website",
          "url": "https://cafarfoilingsystem.com/",
          "name": "CAFAR — Canting Foil Arm System",
          "inLanguage": ["en", "it"],
          "publisher": { "@id": "https://cafarfoilingsystem.com/#organization" }
        }
      ]
    }
    </script>

  <body>

    <script type="module" src="/src/main.tsx"></script>
